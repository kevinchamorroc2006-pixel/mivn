<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>¿Quieres ser mi San Valentín?</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 360px;
            position: relative;
        }

        h1 {
            color: #ff4d6d;
        }

        p {
            font-size: 18px;
            color: #444;
        }

        .buttons {
            margin-top: 25px;
            position: relative;
            height: 120px;
        }

        button {
            padding: 10px 22px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            position: absolute;
        }

        #yes {
            background-color: #ff4d6d;
            color: white;
            left: 50%;
            transform: translateX(-120%);
        }

        #no {
            background-color: #ccc;
            left: 50%;
            transform: translateX(20%);
        }

        #response {
            margin-top: 20px;
            font-size: 20px;
            color: #ff4d6d;
            font-weight: bold;
        }

        #cat {
            margin-top: 15px;
            width: 200px;
            border-radius: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>💘 ¿Quieres ser mi San Valentín? 💘</h1>
        <p>Prometo momentos lindos, risas y mucho cariño ✨</p>

        <div class="buttons">
            <button id="yes" onclick="sayYes()">Sí 💖</button>
            <button id="no" onmouseenter="escape()">No 😅</button>
        </div>

        <div id="response"></div>

        <img id="cat"
             src="https://i.imgur.com/7yUvePI.jpg"
             alt="Gatito tierno">

        <audio id="music" src="those_eyes.mp3"></audio>
    </div>

    <script>
        function sayYes() {
            document.getElementById("response").innerHTML =
                "🥰 Sabía que sí querías 💕";
            
            document.getElementById("cat").style.display = "block";

            const music = document.getElementById("music");
            music.play();
        }

        function escape() {
            const noBtn = document.getElementById("no");
            const container = document.querySelector(".buttons");

            const maxX = container.clientWidth - noBtn.offsetWidth;
            const maxY = container.clientHeight - noBtn.offsetHeight;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }
    </script>

</body>
</html>
